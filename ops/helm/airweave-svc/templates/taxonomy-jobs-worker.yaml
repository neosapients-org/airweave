{{- if .Values.taxonomyJobsWorker.enabled }}
{{- /*
  Taxonomy discover (A13) and propose (A12) jobs: a SEPARATE Deployment of the same image on its
  own Temporal task queue (limits.JOBS_TASK_QUEUE). The sync workers never register these
  activities. The image must carry the full classifier install (see taxonomyJobsWorker.* in
  values.yaml). Off by default; replicas default to 0.
*/ -}}
{{- $fullname := include "airweave-svc.fullname" . }}
{{- if .Values.taxonomyJobsWorker.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-taxonomy-jobs
  labels:
    {{- include "airweave-svc.labels" . | nindent 4 }}
    app.kubernetes.io/component: taxonomy-jobs-worker
  {{- with .Values.taxonomyJobsWorker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
{{- end }}
{{- if .Values.taxonomyJobsWorker.buildConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-taxonomy-jobs-build
  labels:
    {{- include "airweave-svc.labels" . | nindent 4 }}
    app.kubernetes.io/component: taxonomy-jobs-worker
data:
  taxonomy-build.yaml: |
    {{- .Values.taxonomyJobsWorker.buildConfig | nindent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-taxonomy-jobs
  labels:
    {{- include "airweave-svc.labels" . | nindent 4 }}
    app.kubernetes.io/component: taxonomy-jobs-worker
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: {{ .Values.taxonomyJobsWorker.replicaCount }}
  strategy:
    type: Recreate  # one build at a time; never two pods on one job's lease
  selector:
    matchLabels:
      {{- include "airweave-svc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: taxonomy-jobs-worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.taxonomyJobsWorker.buildConfig }}
        # the classifier's YAML is read once at start: a change must roll the pod
        checksum/build-config: {{ .Values.taxonomyJobsWorker.buildConfig | sha256sum }}
        {{- end }}
        {{- if .Values.externalSecrets.enabled }}
        checksum/external-secret: {{ include (print $.Template.BasePath "/external-secrets.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "airweave-svc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: taxonomy-jobs-worker
    spec:
      serviceAccountName: {{ if .Values.taxonomyJobsWorker.serviceAccount.create }}{{ $fullname }}-taxonomy-jobs{{ else }}{{ include "airweave-svc.serviceAccountName" . }}{{ end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.taxonomyJobsWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.taxonomyJobsWorker.terminationGracePeriodSeconds }}
      containers:
        - name: taxonomy-jobs
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "airweave.domains.taxonomy.jobs.worker"]
          {{- if .Values.taxonomyJobsWorker.buildConfig }}
          args: ["/etc/airweave/taxonomy-build.yaml"]
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}
            {{- if .Values.externalSecrets.enabled }}
            - secretRef:
                name: {{ $fullname }}
            {{- end }}
          env:
            - name: TAXONOMY_JOBS_ENABLED
              value: "true"
            {{- range $name, $value := .Values.taxonomyJobsWorker.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.taxonomyJobsWorker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The taxonomy volume first: the scratch volume is mounted inside it.
            - name: taxonomy
              mountPath: /data/airweave-taxonomy
            - name: jobs-work
              mountPath: /data/airweave-taxonomy/jobs
            {{- if .Values.taxonomyJobsWorker.buildConfig }}
            - name: build-config
              mountPath: /etc/airweave
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jobs-work
          emptyDir:
            sizeLimit: {{ .Values.taxonomyJobsWorker.workVolume.sizeLimit }}
        - name: taxonomy
          emptyDir:
            sizeLimit: {{ (.Values.worker.taxonomyVolume).sizeLimit | default "5Gi" }}
        {{- if .Values.taxonomyJobsWorker.buildConfig }}
        - name: build-config
          configMap:
            name: {{ $fullname }}-taxonomy-jobs-build
        {{- end }}
{{- end }}

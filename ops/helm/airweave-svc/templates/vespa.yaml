{{- if .Values.vespa.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: vespa
  namespace: {{ .Release.Namespace }}
  labels:
    app: vespa
    component: search
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - port: {{ .Values.vespa.service.queryPort }}
      name: query
      targetPort: 8081
    - port: {{ .Values.vespa.service.configPort }}
      name: config
      targetPort: 19071
  clusterIP: None
  selector:
    app: vespa
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vespa
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: vespa
  replicas: 1
  selector:
    matchLabels:
      app: vespa
  template:
    metadata:
      labels:
        app: vespa
        component: search
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vespa
          image: {{ .Values.vespa.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: query
            - containerPort: 19071
              name: config
          env:
            {{- /* Must track the release namespace: Vespa matches this against
                   the config server pod's own FQDN. An explicit override wins. */}}
            - name: VESPA_CONFIGSERVERS
              value: {{ (.Values.vespa.env | default dict).VESPA_CONFIGSERVERS | default (printf "vespa-0.vespa.%s.svc.cluster.local" .Release.Namespace) | quote }}
            {{- range $key, $value := (.Values.vespa.env | default dict) }}
            {{- if ne $key "VESPA_CONFIGSERVERS" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.vespa.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.vespa.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.vespa.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: vespa-data
              mountPath: /opt/vespa/var
  volumeClaimTemplates:
    - metadata:
        name: vespa-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.vespa.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.vespa.storage }}
{{- end }}

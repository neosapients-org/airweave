apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "airweave-svc.fullname" . }}
  labels:
    {{- include "airweave-svc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  {{- range $key, $value := .Values.env }}
  {{- if and (ne $key "additional") (kindIs "string" $value) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "airweave-svc.fullname" . }}-postgres-init
  labels:
    {{- include "airweave-svc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  create-databases.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE svix'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'svix')\gexec
    EOSQL
{{- end }}

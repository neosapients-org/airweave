# Default values for airweave-svc
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: 679451892000.dkr.ecr.us-east-1.amazonaws.com/airweave-svc-dev-use1-shared1
  pullPolicy: Always
  tag: latest

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ''

podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '8001'
  prometheus.io/path: '/metrics'

podLabels:
  app.kubernetes.io/component: airweave
  app.kubernetes.io/part-of: neo-platform

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001
  annotations: {}

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
    - host: airweave.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: '1'
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: tmp
    emptyDir: {}
  - name: local-storage
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: local-storage
    mountPath: /data/airweave-storage

nodeSelector:
  karpenter.sh/nodepool: dev-use1-shared1-generic-arm64-w50

tolerations:
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoExecute

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - airweave-svc
          topologyKey: kubernetes.io/hostname

# =============================================================================
# Non-sensitive environment variables (ConfigMap)
# =============================================================================
env:
  # Application
  ENVIRONMENT: production
  LOG_LEVEL: info
  LOCAL_DEVELOPMENT: 'false'
  AUTH_ENABLED: 'true'
  RUN_ALEMBIC_MIGRATIONS: 'true'
  RUN_DB_SYNC: 'true'
  ENABLE_INTERNAL_SOURCES: 'false'

  # PostgreSQL (host/port/db/user — password in secrets)
  POSTGRES_HOST: postgres.neo-datastore.svc.cluster.local
  POSTGRES_PORT: '5432'
  POSTGRES_DB: airweave
  POSTGRES_USER: airweave
  POSTGRES_SSLMODE: disable

  # Redis (host/port — password in secrets)
  REDIS_HOST: redis.neo-datastore.svc.cluster.local
  REDIS_PORT: '6379'
  REDIS_DB: '2'

  # Vespa
  VESPA_URL: http://vespa.neo-datastore.svc.cluster.local
  VESPA_PORT: '8080'
  VESPA_CLUSTER: airweave

  # Temporal
  TEMPORAL_HOST: temporal.neo-datastore.svc.cluster.local
  TEMPORAL_PORT: '7233'
  TEMPORAL_NAMESPACE: airweave
  TEMPORAL_TASK_QUEUE: airweave-sync-queue

  # Embedding configuration
  DENSE_EMBEDDER: openai
  EMBEDDING_DIMENSIONS: '1536'
  SPARSE_EMBEDDER: bm25

  # Classification (LLM-based document categorisation during sync)
  CLASSIFICATION_ENABLED: 'true'
  CLASSIFICATION_MODEL: gpt-4o-mini
  CLASSIFICATION_BATCH_SIZE: '25'

  # Storage backend
  STORAGE_BACKEND: aws
  STORAGE_AWS_REGION: us-east-1

  # Auth0
  AUTH0_RULE_NAMESPACE: https://airweave.ai

  # Sync tuning
  SYNC_MAX_WORKERS: '20'
  SYNC_THREAD_POOL_SIZE: '100'
  WEB_FETCHER_MAX_CONCURRENT: '10'
  OPENAI_MAX_CONCURRENT: '20'

  # Svix webhooks
  SVIX_URL: http://svix.airweave-svc.svc.cluster.local:8071
  WEBHOOK_VERIFY_ENDPOINTS: 'true'

  # Observability
  OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
  OTEL_SERVICE_NAME: airweave-svc
  OTEL_LOGS_EXPORTER: otlp
  OTEL_RESOURCE_ATTRIBUTES: service.name=airweave-svc,service.version=1.0.0,deployment.environment=production,service.namespace=neo-platform

  # SSRF protection
  SSRF_ALLOW_PRIVATE_NETWORKS: 'false'

  # PostHog (public key, non-sensitive)
  POSTHOG_HOST: https://eu.i.posthog.com
  ANALYTICS_ENABLED: 'true'

# =============================================================================
# External Secrets configuration
# =============================================================================
externalSecrets:
  enabled: true
  secretStoreName: aws-secrets-manager
  secretName: airweave-svc-dev-use1-shared1-secrets
  refreshInterval: 0
  secretVersion: "AWSCURRENT"

# Dev environment overrides for airweave-svc
# Only values that differ from values.yaml

replicaCount: 1

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::679451892000:role/airweave-svc-dev-use1-shared1-irsa

image:
  pullPolicy: Always
  tag: "latest"

resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false

env:
  LOG_LEVEL: debug
  ENVIRONMENT: dev
  CLASSIFICATION_ENABLED: 'true'
  AUTH_ENABLED: 'false'
  API_FULL_URL: https://dev-dp.neosapientai.com/v1/meridian
  HF_HOME: /tmp/hf_cache
  XDG_CACHE_HOME: /tmp/cache
  # Neo chunking, labels and search (contract airweave-neo/1, section 9)
  CHUNKER_MODE: sentence_pack
  CHUNK_TARGET_TOKENS: '300'
  SEARCH_FILTER_GROUPS_OR: 'true'
  # Topic labels. The taxonomy files live under taxonomy/ in the dev bucket; the service
  # account's role (above) already reads and writes that bucket.
  TAXONOMY_ENABLED: 'true'
  TAXONOMY_S3_BUCKET: airweave-dev-use1-shared1
  # USD per re-label, discover or propose job (a discovery on ~20 documents costs about 0.03)
  TAXONOMY_SPEND_CAP_USD: '1'
  # Discover and propose jobs. 20 chunks is the small-corpus floor the T1 test workspaces need
  # (about 20 documents make about 30 chunks); the default of 100 refuses them.
  TAXONOMY_JOBS_ENABLED: 'true'
  DISCOVER_MIN_CHUNKS: '20'

ingress:
  enabled: false

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 120
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector:
  karpenter.sh/nodepool: dev-use1-shared1-generic-arm64-w50

tolerations:
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoExecute

postgresql:
  storage: 5Gi
  # Shared by the airweave backend, worker, Temporal, and Svix. 50 was too low:
  # a node reschedule caused a simultaneous reconnect that exhausted the pool
  # ("FATAL: sorry, too many clients already") and 500'd all DB-backed endpoints.
  args:
    - -c
    - max_connections=200
    - -c
    - shared_buffers=128MB
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi

redis:
  storage: 1Gi
  resources:
    limits:
      cpu: 100m
      memory: 128Mi 
    requests:
      cpu: 25m
      memory: 64Mi

temporal:
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

vespa:
  storage: 10Gi
  resources:
    limits:
      cpu: '1'
      memory: 6Gi
    requests:
      cpu: 250m
      memory: 3Gi

worker:
  replicaCount: 1
  resources:
    limits:
      cpu: '2'
      memory: 3Gi
    requests:
      cpu: 500m
      memory: 1Gi

# Discover and propose jobs (see values.yaml). Dev runs them under the main service account,
# whose role already has read and write on the dev bucket; production uses a separate account
# with write on taxonomy/tenants/*/candidates/* only.
taxonomyJobsWorker:
  enabled: true
  replicaCount: 1
  nodeSelector:
    karpenter.sh/nodepool: dev-use1-shared1-generic-arm64-w50
  resources:
    limits:
      cpu: '2'
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  # The classifier's settings for a first taxonomy: the small-corpus profile every T1 test run
  # used (test workspaces of about 20 documents), the gpt-5.4-mini reviewer, and COMPANY scope
  # allowed for new topics (each taxonomy belongs to one tenant, so without it an update can
  # never add a topic). The job sets the cap, caches and paths itself.
  buildConfig: |
    # The small-corpus profile of the T1 test runs (copied from the package's example config, whose comments
    # describe its own reference build). The content-form patterns are kept as they are: a piece is administrative
    # only with 3+ signature, cover or exhibit matches or under 15 words; a boilerplate phrase alone changes nothing.
    # The job sets the cap, the caches and the paths itself (see llm.max_cost_usd).

    run:
      seed: 42                        # calibration fold shuffling
      taxonomy_id: null               # deployment-specific free-form id, e.g. legal_contracts; null -> "default"
      domain: null                    # free-form label recorded in the artifact (metadata only; the engine never branches on it)
      taxonomy_version: null          # deployment-specific; null -> "taxonomy-<UTC timestamp>"

    input:
      # Optional Airweave chunk metadata keys used by the algorithm. Missing keys fall back to document_id / "n/a".
      fields:
        group: company                # source group: diversity screens + leave-group-out calibration (company, tenant, source, ...)
        segment: industry             # shown to the cluster reviewer
        doc_type: source              # shown to the cluster reviewer

    taxonomy_chunking:                # the ~300-token analysis children, created inside each Airweave chunk
      tokenizer: cl100k_base
      target_tokens: 70
      hard_max_tokens: 110            # 1.5 x target
      min_tokens_merge: 25            # trailing group < 0.3 x target is merged into the previous one (same parent)
      overlap_tokens: 0

    embedding:
      provider: openai
      model: text-embedding-3-small
      dimensions: 1536
      batch_size: 256
      cache_path: cache/embeddings.sqlite   # canonical cache: one vector per text, first write wins
      price_per_m_tokens_usd: 0.02

    content_form:                     # rule-based metadata; ADMINISTRATIVE chunks bypass semantic assignment
      administrative_bypass: true
      # CORPUS-SPECIFIC: these patterns were verified on the reference corpus (SEC regulatory filings). For another corpus
      # replace them with that corpus's boilerplate, or set `patterns: {}` (then only the generic rules apply: tables,
      # lists, chunks with < 15 words). They are frozen into final_taxonomy.json at build time so classification bypasses
      # exactly the same text.
      patterns:
        signature: '/s/|\bSIGNATURES?\b|Pursuant to the requirements of (?:Section 13|the Securities Exchange Act)|duly authorized|Principal (?:Executive|Financial|Accounting) Officer'
        exhibit: '[Ii]ncorporated (?:herein )?by reference|[Ff]iled herewith|[Ff]urnished herewith|\bExhibits?\b'
        exhibit_row: '(?:^|\|)\s*\(?\d{1,3}(?:\.\d{1,3}|-\d{1,3})[a-z]?\)?\*?\s*\|\s*[A-Z][a-z]'
        cover: 'Commission [Ff]ile [Nn]umber|Indicate by check mark|☐|☒|\(Exact name of registrant|I\.R\.S\. Employer|IRS Employer|Large accelerated filer|Securities registered pursuant to Section 12|Trading [Ss]ymbol|Name of each exchange|\bTable of Contents\b|\bPage\s*\|'
        boilerplate: 'forward-looking statements|safe harbor|Private Securities Litigation Reform Act|disclosure controls and procedures|internal control over financial reporting|Rule 10b5-1|not required|incorporated herein by reference|should be read in conjunction|has been omitted|not applicable'

    clustering:
      umap: {n_components: 4, n_neighbors: 4, min_dist: 0.0, metric: cosine}
      seeds: [42, 43, 44, 45, 46]
      hdbscan_settings:
        - [3, 1]
        - [3, 2]
        - [4, 2]
      cluster_selection_method: leaf
      stability:
        match_jaccard: 0.4            # a cluster "recurs" in another seed if best Jaccard >= 0.5
        min_seed_recurrence: 2        # out of 5 seeds (incl. the reference seed)
        min_mean_overlap: 0.4
      screens:
        min_chunks: 4
        min_documents: 2
        max_document_share: 0.7
      dedup_jaccard: 0.5
      hierarchy: {min_overlap: 0.8, min_size_ratio: 1.5}

    llm:
      provider: openai
      model: gpt-5.4-mini-2026-03-17
      corpus_description: "a document collection indexed by Airweave"   # deployment-specific; inserted into the system prompts
      pricing:                        # USD per 1M tokens (check current provider pricing)
        input: 0.75
        cached_input: 0.075
        output: 4.50
      max_cost_usd: 0.5               # not used here: each job replaces it with its own cap (TAXONOMY_SPEND_CAP_USD)
      cache_dir: cache/llm            # responses cached by input hash; a rerun with the same inputs costs $0
      retry: {max_attempts: 4, backoff_s: 4, retry_on_http: [429, 500, 502, 503, 504]}
      invalid_response_policy: retry_once_then_mark_failed

    semantic_review:
      prompt_version: cluster_semantic_review_v2
      reasoning_effort: low
      max_output_tokens: 3000
      central_chunks: 5
      diverse_chunks: 4
      chars_per_chunk: 1400
      top_terms: 15
      duplicate_context:              # only categories accepted EARLIER IN THE SAME BUILD are shown
        centroid_cosine: 0.90
        max_candidates: 3
      concurrency: 1                  # sequential: duplicate context depends on earlier decisions

    consolidation:
      prompt_version: broad_family_consolidation_v2
      repair_prompt_version: broad_family_repair_v2
      reasoning_effort: low
      max_output_tokens: 32000
      excerpts_per_category: 2
      chars_per_excerpt: 220
      nearest_categories: 3
      document_noun: documents        # wording used in the consolidation payload
      group_noun: source groups

    assignment:                       # classification of new chunks: dense + BM25 + RRF, no LLM
      rrf_k: 60
      window: 5                       # a category must be in the RRF top-5 of the chunk
      profile_terms: 300              # BM25 terms kept per category profile
      bm25: {k1: 1.2, b: 0.75, min_df: 5, max_df: 0.5}
      calibration:                    # thresholds are calibrated at build time, leave-group-out
        folds: 3
        precision_min: 0.90
        junk_max: 0.10
        category_quantile: 0.10
        category_min_heldout: 3
        min_members_for_prototype: 4
        # no administrative/structural negatives in the build corpus -> thresholds cannot be calibrated and fall back to the
        # strictest values. error | warn_and_use_default (warn, keep strict fallback) | explicit_strict_fallback (record only)
        on_empty_junk_pool: warn_and_use_default
      acceptance:                     # which acceptance policy classifies children (taxonomy artifacts carry no model)
        policy: calibrated            # calibrated (per-taxonomy calibrated RRF floors) | learned (frozen acceptance model)
        model_manifest: null          # learned: path to the model manifest.json (feature schema, threshold, sha256)
        model_path: null              # learned: model file (default: next to the manifest)
        probation_gate: {p_min: 0.95, bm25_rank_max: 2, dense_rank_max: 2}   # learned: PROBATIONARY categories (validated arm D)

    novelty:                          # periodic maintenance job over unresolved taxonomy chunks
      enabled: true
      prompt_version: novelty_cluster_review_v2
      reasoning_effort: low
      max_output_tokens: 2500
      umap: {n_components: 5, n_neighbors: 6, min_dist: 0.0, metric: cosine}
      seeds: [42, 43, 44]
      hdbscan_settings: [[5, 3], [8, 3], [8, 8], [12, 12], [20, 20]]
      min_cluster_size_for_review: 8
      min_documents: 3
      min_companies_new_category: 2   # minimum distinct source groups for a new category
      candidate_categories: 8         # whole-taxonomy search (dense+BM25 RRF over ALL categories)
      central_chunks: 8
      diverse_chunks: 4
      chars_per_chunk: 800
      per_chunk_verification:
        rule: dense_top_k             # a chunk joins mapped category X only if X is in the chunk's own dense top-k
        k: 5

    evolution:                        # versioned wave evolution (engine.run_wave); validated research path (scenario A, arm D)
      min_pool_for_clustering: 20     # fewer unresolved children -> no residual clustering this wave
      precheck:                       # code-only MAP_EXISTING before any LLM review
        centroid_cosine_min: 0.85
        member_top1_share_min: 0.60
      creation:                       # CREATE_NEW gates (after per-member verification in the members' own dense top-k)
        min_documents: 2
        min_groups: 2
        scopes: [GLOBAL, INDUSTRY, COMPANY]   # Neo: one tenant per taxonomy, so COMPANY topics are allowed
      structural_filter:
        enabled: true                 # a proposed category must be classified SEMANTIC_TOPIC
        prompt_version: structural_category_review_v2
        reasoning_effort: low
        max_output_tokens: 1500
      new_category_status: PROBATIONARY
      new_category_prefix: CAT_NEW_
      map_into_young_categories_requires_gate: true   # learned policy: mapped members must pass the probation gate
      revisit_pool_after_change: true                 # re-classify the unresolved pool against taxonomy v+1

    aggregation:
      min_supporting_children: 1      # a topic is attached to an Airweave chunk if >= 1 child carries it directly

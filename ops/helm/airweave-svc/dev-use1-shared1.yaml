# Dev environment overrides for airweave-svc
# Only values that differ from values.yaml

replicaCount: 1

image:
  pullPolicy: Always
  tag: "latest"

resources:
  limits:
    cpu: 500m
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false

env:
  LOG_LEVEL: debug
  ENVIRONMENT: development
  CLASSIFICATION_ENABLED: 'false'

ingress:
  enabled: true
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: dev-use1-shared-alb
    alb.ingress.kubernetes.io/group.name: shared-alb
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:us-east-1:679451892000:certificate/679d14b9-7d7a-4553-aeeb-8141824de212'

nodeSelector:
  karpenter.sh/nodepool: dev-use1-shared1-generic-arm64-w50

tolerations:
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoExecute

postgresql:
  storage: 5Gi
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

redis:
  storage: 1Gi
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 64Mi

temporal:
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

vespa:
  storage: 10Gi
  resources:
    limits:
      cpu: '1'
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi

worker:
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

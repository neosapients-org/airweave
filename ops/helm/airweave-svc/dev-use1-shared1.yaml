# Dev environment overrides for airweave-svc
# Only values that differ from values.yaml

replicaCount: 1

image:
  pullPolicy: Always
  tag: "latest"

resources:
  limits:
    cpu: 500m
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false

env:
  LOG_LEVEL: debug
  ENVIRONMENT: dev
  CLASSIFICATION_ENABLED: 'false'
  AUTH_ENABLED: 'false'

ingress:
  enabled: false

nodeSelector:
  karpenter.sh/nodepool: dev-use1-shared1-generic-arm64-w50

tolerations:
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoExecute

postgresql:
  storage: 5Gi
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

redis:
  storage: 1Gi
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 64Mi

temporal:
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

vespa:
  storage: 10Gi
  resources:
    limits:
      cpu: '1'
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi

worker:
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
